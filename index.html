<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Firebase Chat — Attachments + Emoji (Fixed)</title>
  <style>
    body { font-family: Arial; background:#0a0a0a; color:white; padding:0; margin:0; }
    /* Login */
    #loginScreen { width:100%; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#000; }
    input,button{ border-radius:8px; }
    #nameInput{ width:260px; padding:12px; border:2px solid #333; background:#111; color:white; font-size:16px; }
    #enterBtn{ width:260px; padding:12px; margin-top:10px; background:#0af; border:none; color:white; font-size:16px; cursor:pointer; }

    /* Chat UI */
    #chatScreen{ padding:20px; display:none; max-width:900px; margin:0 auto; }
    #messages{ background:#000; height:420px; overflow-y:auto; padding:12px; border-radius:10px; border:1px solid #222; box-sizing:border-box; }
    .input-area{ display:flex; gap:8px; margin-top:12px; align-items:center; position:relative; }
    #msg{ flex:1; padding:10px; border:2px solid #333; background:#111; color:white; border-radius:10px; }
    #emojiBtn,#fileBtn{ width:44px; height:44px; background:#222; border:none; cursor:pointer; font-size:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
    #sendBtn{ padding:10px 16px; background:#0af; color:white; border:none; cursor:pointer; border-radius:10px; }
    #uploadProgress{ position:absolute; left:60px; bottom:54px; display:none; background:#111; padding:6px 10px; border-radius:8px; border:1px solid #333; font-size:13px; }

    /* Bubbles — smaller (Discord style) */
    .chat-row{ display:flex; margin:6px 0; }
    .chat-bubble{ max-width:68%; padding:8px 10px; font-size:14px; border-radius:8px; animation:pop .15s; word-wrap:break-word; }
    .message-you{ background:#55ff55; color:#000; margin-left:auto; border-bottom-right-radius:4px; }
    .message-friend{ background:#4aa3ff; color:white; margin-right:auto; border-bottom-left-radius:4px; }
    .meta{ font-size:12px; opacity:0.85; margin-bottom:4px; }

    @keyframes pop{ 0%{ transform: scale(.96); opacity:.5 } 100%{ transform: scale(1); opacity:1 } }
    a.attachment { display:inline-block; margin-top:6px; padding:6px 8px; background:rgba(0,0,0,0.15); border-radius:6px; color:inherit; text-decoration:none; border:1px solid rgba(255,255,255,0.06); }
    .small { font-size:12px; opacity:0.9; margin-left:6px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>👤 Enter Your Name</h2>
  <input id="nameInput" placeholder="Your name...">
  <button id="enterBtn">Enter Chat</button>
</div>

<!-- CHAT -->
<div id="chatScreen">
  <h2>🔥 Firebase Chat</h2>
  <div id="messages"></div>

  <div id="uploadProgress">Uploading... <span id="uploadPct">0%</span></div>

  <div class="input-area">
    <button id="emojiBtn" title="Emoji">😊</button>
    <button id="fileBtn" title="Attach file">📎</button>
    <input id="msg" placeholder="Type message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

  <input type="file" id="fileInput" style="display:none" />
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<!-- Emoji picker (Emoji Button) -->
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.2/dist/index.min.js"></script>

<script>
  // ---------- Firebase config (unchanged core logic) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyCwSqm65CoNwPc3PiVo1T40YJM2MAcg480",
    authDomain: "server-1-9fa4f.firebaseapp.com",
    databaseURL: "https://server-1-9fa4f-default-rtdb.firebaseio.com",
    projectId: "server-1-9fa4f",
    storageBucket: "server-1-9fa4f.firebasestorage.app",
    messagingSenderId: "1019529146427",
    appId: "1:1019529146427:web:e22f6bbe1623b528f6ec1e"
  };
  firebase.initializeApp(firebaseConfig);

  // ---------- Refs ----------
  const db = firebase.database();
  const storage = firebase.storage();
  const room = "chat-room-1";

  // ---------- DOM ----------
  const loginScreen = document.getElementById('loginScreen');
  const chatScreen = document.getElementById('chatScreen');
  const nameInput = document.getElementById('nameInput');
  const enterBtn = document.getElementById('enterBtn');

  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('sendBtn');
  const emojiBtn = document.getElementById('emojiBtn');
  const fileBtn = document.getElementById('fileBtn');
  const fileInput = document.getElementById('fileInput');

  const uploadProgress = document.getElementById('uploadProgress');
  const uploadPct = document.getElementById('uploadPct');

  let username = "";
  let myId = "";

  // ---------- Enter chat ----------
  enterBtn.onclick = () => {
    username = nameInput.value.trim();
    if(!username) return alert("Please enter a name");
    myId = username + "-" + Math.floor(Math.random()*100000);
    loginScreen.style.display = 'none';
    chatScreen.style.display = 'block';
    msgInput.focus();
  };
  nameInput.addEventListener('keypress', e => { if(e.key === 'Enter') enterBtn.click(); });

  // ---------- Send message (text or attachment metadata) ----------
  function pushMessage(payload){
    // payload = { text?, user, name, time, attachment? }
    db.ref(room).push(payload);
  }

  function sendText(){
    const text = msgInput.value.trim();
    if(!text) return;
    pushMessage({ text, user: myId, name: username, time: Date.now() });
    msgInput.value = '';
  }
  sendBtn.addEventListener('click', sendText);
  msgInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendText(); });

  // ---------- Emoji picker (Emoji Button) ----------
  const picker = new EmojiButton({
    position: 'top-end',
    theme: 'dark',
    zIndex: 2000
  });
  picker.on('emoji', selection => {
    // selection.emoji contains the emoji string
    msgInput.value += selection.emoji;
    msgInput.focus();
  });
  emojiBtn.addEventListener('click', () => {
    picker.togglePicker(emojiBtn);
  });

  // ---------- Attachment upload ----------
  fileBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    // disable input while uploading
    sendBtn.disabled = true;
    fileBtn.disabled = true;
    emojiBtn.disabled = true;
    msgInput.disabled = true;
    uploadProgress.style.display = 'block';
    uploadPct.innerText = '0%';

    try {
      const timestamp = Date.now();
      // safe path: attachments/room/timestamp_filename
      const safeName = file.name.replace(/\s+/g, '_').replace(/[^\w.\-()]/g,'');
      const path = `attachments/${room}/${timestamp}_${safeName}`;
      const ref = storage.ref().child(path);
      const uploadTask = ref.put(file);

      uploadTask.on('state_changed', snapshot => {
        const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
        uploadPct.innerText = pct + '%';
      });

      await uploadTask; // wait until finish
      const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();

      // push message with attachment object
      pushMessage({
        user: myId,
        name: username,
        time: Date.now(),
        attachment: {
          name: file.name,
          url: downloadURL,
          size: file.size,
          type: file.type || 'application/octet-stream'
        }
      });
    } catch(err){
      console.error('Upload error', err);
      alert('Upload failed: ' + (err.message || err));
    } finally {
      // reset UI
      uploadProgress.style.display = 'none';
      uploadPct.innerText = '0%';
      sendBtn.disabled = false;
      fileBtn.disabled = false;
      emojiBtn.disabled = false;
      msgInput.disabled = false;
      fileInput.value = ''; // clear
      msgInput.focus();
    }
  });

  // ---------- Render messages ----------
  function formatTime(ts){
    try {
      const d = new Date(ts);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch { return ''; }
  }

  db.ref(room).on('child_added', snap => {
    const d = snap.val();
    if(!d) return;
    const isMe = d.user === myId;
    const row = document.createElement('div');
    row.className = 'chat-row';

    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + (isMe ? 'message-you' : 'message-friend');

    // meta (name + time)
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<strong>${isMe ? 'You' : (d.name || 'Friend')}</strong> <span class="small">${formatTime(d.time)}</span>`;
    bubble.appendChild(meta);

    // text
    if(d.text){
      const txt = document.createElement('div');
      txt.innerHTML = d.text.replace(/\n/g, '<br>');
      bubble.appendChild(txt);
    }

    // attachment
    if(d.attachment){
      const a = document.createElement('a');
      a.className = 'attachment';
      a.href = d.attachment.url;
      a.download = d.attachment.name || '';
      a.target = '_blank';
      // show file name and size
      const sizeKB = Math.round((d.attachment.size || 0) / 1024);
      a.innerText = `📎 ${d.attachment.name} (${sizeKB} KB) — Download`;
      bubble.appendChild(a);
    }

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

  // optional: handle DB errors
  db.ref(room).on('child_changed', () => {});
  db.ref(room).on('child_removed', () => {});

  // focus behaviors
  window.addEventListener('load', () => {
    nameInput.focus();
  });
</script>
</body>
</html>
