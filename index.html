<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Firebase Chat</title>
<!-- Emoji font so emojis render correctly -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji" rel="stylesheet">
<style>
body {
  font-family: Arial, "Noto Color Emoji", sans-serif; /* <- fixed emojis */
  background: #111;
  color: white;
  margin: 0;
  padding: 0;
}

/* Login screen */
#loginScreen {
  display: flex;
  flex-direction: column;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

#nameInput {
  width: 250px;
  padding: 10px;
  margin-bottom: 10px;
  background: #222;
  border: 1px solid #444;
  color: white;
  border-radius: 8px;
  text-align: center;
}

#enterBtn {
  width: 250px;
  padding: 10px;
  background: #0af;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* Chat screen */
#chatScreen {
  display: none;
  padding: 20px;
}

#messages {
  height: 400px;
  overflow-y: auto;
  background: #000;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #333;
}

.chat-row {
  display: flex;
  margin: 8px 0;
}

.message-you {
  margin-left: auto;
  background: #0f0;
  color: #000;
  padding: 10px;
  border-radius: 10px 10px 0 10px;
  max-width: 70%;
  word-wrap: break-word;
}

.message-friend {
  margin-right: auto;
  background: #09f;
  color: white;
  padding: 10px;
  border-radius: 10px 10px 10px 0;
  max-width: 70%;
  word-wrap: break-word;
}

.input-area {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#msg {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #111;
  color: white;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  background: #0af;
  color: white;
  cursor: pointer;
}

#emojiPicker {
  display: none;
  background: #222;
  padding: 8px;
  border-radius: 8px;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}

.emoji {
  cursor: pointer;
  font-size: 20px;
  padding: 4px;
}
.emoji:hover {
  background: #333;
  border-radius: 5px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>Enter Your Name</h2>
  <input id="nameInput" placeholder="Your name..." />
  <button id="enterBtn">Enter Chat</button>
</div>

<!-- CHAT -->
<div id="chatScreen">
  <h2>Firebase Chat</h2>
  <div id="messages"></div>

  <div id="emojiPicker"></div>

  <div class="input-area">
    <button id="emojiBtn">😊</button>
    <input id="msg" placeholder="Type your message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// Firebase setup
const firebaseConfig = {
  apiKey: "AIzaSyCwSqm65CoNwPc3PiVo1T40YJM2MAcg480",
  authDomain: "server-1-9fa4f.firebaseapp.com",
  databaseURL: "https://server-1-9fa4f-default-rtdb.firebaseio.com",
  projectId: "server-1-9fa4f",
  storageBucket: "server-1-9fa4f.firebasestorage.app",
  messagingSenderId: "1019529146427",
  appId: "1:1019529146427:web:e22f6bbe1623b528f6ec1e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const room = "chat-room-1";

// DOM elements
const loginScreen = document.getElementById("loginScreen");
const chatScreen = document.getElementById("chatScreen");
const nameInput = document.getElementById("nameInput");
const enterBtn = document.getElementById("enterBtn");
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");
const emojiBtn = document.getElementById("emojiBtn");
const emojiPicker = document.getElementById("emojiPicker");

let myId = "";
let username = "";

// Enter chat
enterBtn.onclick = () => {
  username = nameInput.value.trim();
  if (!username) return alert("Enter your name!");
  myId = username + "-" + Math.floor(Math.random() * 10000);
  loginScreen.style.display = "none";
  chatScreen.style.display = "block";
  msgInput.focus();
};

// Send message
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  db.ref(room).push({
    text,
    user: myId,
    name: username,
    time: Date.now()
  });
  msgInput.value = "";
}
sendBtn.onclick = sendMessage;
msgInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

// Receive messages
db.ref(room).on("child_added", snap => {
  const data = snap.val();
  if (!data || !data.text) return;
  const div = document.createElement("div");
  div.className = "chat-row";
  const bubble = document.createElement("div");
  bubble.className = data.user === myId ? "message-you" : "message-friend";
  bubble.textContent = (data.user === myId ? "You: " : data.name + ": ") + data.text;
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

// Emoji picker
const emojis = "😀😁😂🤣😃😄😅😆😉😊😍😘😜😎🤩😢😭😡😱😴🤔😇🥳❤️💙💚💛💜🔥⭐⚡🎉💯".split("");
emojis.forEach(e => {
  const span = document.createElement("span");
  span.textContent = e;
  span.className = "emoji";
  span.style.fontFamily = '"Noto Color Emoji", Arial'; // ensures real emoji
  span.onclick = () => {
    msgInput.value += e;
    emojiPicker.style.display = "none";
    msgInput.focus();
  };
  emojiPicker.appendChild(span);
});
emojiBtn.onclick = () => {
  emojiPicker.style.display = emojiPicker.style.display === "flex" ? "none" : "flex";
  emojiPicker.style.flexWrap = "wrap";
};
</script>
</body>
</html>
