<!DOCTYPE html>
<html>
<head>
<title>Firebase Chat</title>

<style>
body { 
    font-family: Arial; 
    background:#0a0a0a; 
    color:white; 
    padding:20px;
}

/* input & button */
#msg { 
    width:100%; padding:12px; margin-top:10px; 
    box-sizing:border-box; border:2px solid #333; 
    background:#111; color:white;
    border-radius:8px;
}
#msg:focus { border-color:#0af; outline:none; }

button { 
    width:100%; padding:12px; margin-top:10px; 
    cursor:pointer; background:#0af; color:white; 
    border:none; border-radius:8px; 
    font-size:15px; font-weight:bold;
    transition:0.2s;
}
button:hover { transform:scale(1.03); }
button:active { transform:scale(0.98); background:#08c; }

#messages { 
    background:#000; 
    height:350px; overflow-y:scroll; padding:10px; 
    margin-top:15px; border-radius:10px; 
    border:1px solid #222;
}

/* bubble base */
.chat-bubble {
    max-width:75%;
    padding:10px 15px;
    margin:6px 0;
    border-radius:15px;
    display:inline-block;
    font-size:15px;
    animation:pop .25s ease-out;
}

/* your bubble */
.message-you {
    background:#0f0;
    color:#000;
    margin-left:auto;
    border-bottom-right-radius:3px;
}

/* friend bubble */
.message-friend {
    background:#0af;
    color:white;
    margin-right:auto;
    border-bottom-left-radius:3px;
}

/* animation */
@keyframes pop {
    0% { transform:scale(.8) translateY(5px); opacity:.4; }
    100% { transform:scale(1) translateY(0); opacity:1; }
}
</style>
</head>

<body>
<h2>🔥 Firebase Chat</h2>
<input id="msg" placeholder="Type your message...">
<button id="sendBtn">Send</button>
<div id="messages"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwSqm65CoNwPc3PiVo1T40YJM2MAcg480",
  authDomain: "server-1-9fa4f.firebaseapp.com",
  databaseURL: "https://server-1-9fa4f-default-rtdb.firebaseio.com",
  projectId: "server-1-9fa4f",
  storageBucket: "server-1-9fa4f.firebasestorage.app",
  messagingSenderId: "1019529146427",
  appId: "1:1019529146427:web:e22f6bbe1623b528f6ec1e"
};
firebase.initializeApp(firebaseConfig);

let db = firebase.database();
let room = "chat-room-1"; 
let messages = document.getElementById("messages");
let msgInput = document.getElementById("msg");
let sendBtn = document.getElementById("sendBtn");

let myId = 'user-' + Math.floor(Math.random()*100000);

sendBtn.onclick = () => {
    let text = msgInput.value.trim();
    if(!text) return;
    db.ref(room).push({ text, user: myId, time: Date.now() });
    msgInput.value = "";
};

// Press Enter to send
msgInput.addEventListener("keypress", e=>{
    if(e.key === "Enter") sendBtn.onclick();
});

db.ref(room).on("child_added", snap => {
    let data = snap.val();
    if(data && data.text){
        let cls = (data.user === myId) ? 'message-you' : 'message-friend';
        messages.innerHTML += `
            <div class="chat-bubble ${cls}">
                ${data.text}
            </div><br>
        `;
        messages.scrollTop = messages.scrollHeight;
    }
});
</script>
</body>
</html>
