<!DOCTYPE html>
<html>
<head>
<title>Firebase Chat</title>

<style>
body { 
    font-family: Arial; background:#0a0a0a; color:white; 
    padding:0; margin:0;
}

/* Login screen */
#loginScreen {
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    background:#000;
}
#nameInput {
    width:260px; padding:12px;
    border-radius:8px; border:2px solid #333;
    background:#111; color:white; font-size:16px;
}
#enterBtn {
    width:260px; padding:12px; margin-top:10px;
    border:none; border-radius:8px;
    background:#0af; color:white; font-size:16px; cursor:pointer;
}
#enterBtn:hover { transform:scale(1.03); }
#enterBtn:active { transform:scale(.97); }

/* Chat UI */
#chatScreen { padding:20px; display:none; }
#messages { 
    background:#000; height:350px; overflow-y:scroll; 
    padding:10px; border-radius:10px; border:1px solid #222;
}
#msg {
    width:100%; padding:12px; margin-top:10px; box-sizing:border-box;
    border-radius:8px; border:2px solid #333; background:#111; color:white;
}
#msg:focus { border-color:#0af; outline:none; }

button { 
    width:100%; padding:12px; margin-top:10px; cursor:pointer;
    background:#0af; border:none; border-radius:8px; color:white; font-size:15px;
}

/* Bubbles */
.chat-bubble {
    max-width:75%;
    padding:10px 15px;
    margin:6px;
    border-radius:12px;
    font-size:15px;
    animation:pop .2s;
}
.message-you {
    background:#0f0; color:#000; margin-left:auto;
    border-bottom-right-radius:3px;
}
.message-friend {
    background:#0af; color:white; margin-right:auto;
    border-bottom-left-radius:3px;
}

/* Animation */
@keyframes pop { 
 0%{transform:scale(.8);opacity:.4;} 
 100%{transform:scale(1);opacity:1;} 
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginScreen">
    <h2>👤 Enter Your Name</h2>
    <input id="nameInput" placeholder="Your name...">
    <button id="enterBtn">Enter Chat</button>
</div>

<!-- CHAT PAGE -->
<div id="chatScreen">
    <h2>🔥 Firebase Chat</h2>
    <div id="messages"></div>
    <input id="msg" placeholder="Type message...">
    <button id="sendBtn">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// Firebase (same config you gave)
const firebaseConfig = {
  apiKey: "AIzaSyCwSqm65CoNwPc3PiVo1T40YJM2MAcg480",
  authDomain: "server-1-9fa4f.firebaseapp.com",
  databaseURL: "https://server-1-9fa4f-default-rtdb.firebaseio.com",
  projectId: "server-1-9fa4f",
  storageBucket: "server-1-9fa4f.firebasestorage.app",
  messagingSenderId: "1019529146427",
  appId: "1:1019529146427:web:e22f6bbe1623b528f6ec1e"
};
firebase.initializeApp(firebaseConfig);

// Base logic unchanged
let db = firebase.database();
let room = "chat-room-1"; 
let messages = document.getElementById("messages");
let msgInput = document.getElementById("msg");
let sendBtn = document.getElementById("sendBtn");
let nameInput = document.getElementById("nameInput");
let enterBtn = document.getElementById("enterBtn");
let loginScreen = document.getElementById("loginScreen");
let chatScreen = document.getElementById("chatScreen");

let username = "";
let myId = "";

// Enter chat
enterBtn.onclick = () => {
    username = nameInput.value.trim();
    if(!username) return alert("Enter a name!");

    myId = username + "-" + Math.floor(Math.random()*100000);

    loginScreen.style.display = "none";
    chatScreen.style.display = "block";
};

// Send message
function sendMessage(){
    let text = msgInput.value.trim();
    if(!text) return;

    db.ref(room).push({ text, user: myId, name: username, time: Date.now() });
    msgInput.value = "";
}
sendBtn.onclick = sendMessage;

// Press Enter = send
msgInput.addEventListener("keypress", e => {
    if(e.key === "Enter") sendMessage();
});
nameInput.addEventListener("keypress", e => {
    if(e.key === "Enter") enterBtn.click();
});

// Display messages
db.ref(room).on("child_added", snap => {
    let data = snap.val();
    if(data && data.text){
        let cls = (data.user === myId) ? 'message-you' : 'message-friend';
        messages.innerHTML += `
            <div class="chat-bubble ${cls}">
                <b>${data.user === myId ? "You" : data.name}:</b><br>${data.text}
            </div>
        `;
        messages.scrollTop = messages.scrollHeight;
    }
});
</script>
</body>
</html>
