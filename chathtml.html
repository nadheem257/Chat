<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHATBLES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  body {
    font-family: 'Inter', Arial, sans-serif;
    background:
      radial-gradient(circle at center, rgba(44, 10, 80, 0.8), transparent 60%),
      linear-gradient(135deg, #0a041a, #230c3d 40%, #160a2c 100%),
      url('https://www.transparenttextures.com/patterns/polished-metal.png');
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    color: #e2d9ff;
    overflow-x: hidden;
    cursor: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1#appName {
    font-size: 3.8rem;
    font-weight: 900;
    color: #a37fff;
    text-shadow: 0 0 14px #754dff, 0 0 30px #8d6aff;
    margin-bottom: 30px;
    user-select: none;
    letter-spacing: 0.14em;
    text-align: center;
    width: 100%;
  }

  #landingButtons {
    display: flex;
    gap: 24px;
    margin-bottom: 40px;
  }

  button {
    cursor: pointer;
    padding: 12px 28px;
    background: linear-gradient(90deg,#8353ff 48%,#31a5ff 110%);
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    box-shadow: 0 4px 15px rgba(130,90,255,0.6);
    text-shadow: 0 0 4px #b79bff;
    transition: all 0.3s ease;
    user-select: none;
  }
  button:hover, button:focus {
    background: linear-gradient(90deg,#9f78ff 42%,#5ec7ff 115%);
    box-shadow: 0 0 24px #9158ff;
    transform: scale(1.05);
  }

  #chatSection, #videoCallSection {
    display: none;
    width: 100%;
    max-width: 900px;
    margin-top: 10px;
    flex-direction: column;
    align-items: center;
    background: rgba(30, 15, 60, 0.8);
    border-radius: 18px;
    box-shadow: 0 0 28px rgba(120,90,255,0.35);
    padding: 20px;
    position: relative;
    user-select: auto;
  }

  .exitBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 8px 18px;
    background: linear-gradient(90deg,#ff46c7 48%,#ab00ff 110%);
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 120, 255, 0.5);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .exitBtn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 22px rgba(255, 170, 255, 0.8);
  }

  #videos {
    display: flex;
    gap: 20px;
    width: 100%;
    justify-content: center;
    margin-bottom: 15px;
  }

  .camera-box, .remote-box {
    width: 300px;
    height: 188px;
    background: #070d0c;
    border-radius: 18px;
    box-shadow: 0 10px 38px rgba(135,100,255,0.5), 0 0 0 2px #2b1748;
    overflow: hidden;
    position: relative;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    background: black;
    display: block;
  }

  #chatSection h2, #videoCallSection h2 {
    color: #cabfff;
    text-shadow: 0 0 12px #8f7fff;
    margin-bottom: 10px;
    text-align: center;
  }

  #chatBox {
    height: 400px;
    overflow-y: auto;
    background: rgba(45,25,90,0.65);
    padding: 10px;
    border-radius: 14px;
    margin-bottom: 12px;
    color: #e6ddff;
    font-size: 1rem;
    line-height: 1.4;
    text-align: left;
  }

  .chat-message.You {
    text-align: right;
    font-weight: 600;
    color: #c7a8ff;
  }

  .chat-message.Friend {
    text-align: left;
    color: #dbd0ff;
  }

  #msgInput {
    border-radius: 12px;
    border: none;
    padding: 12px;
    font-size: 1rem;
    width: 100%;
    box-sizing: border-box;
    background: #1e123d;
    color: #e8dbff;
    box-shadow: inset 0 0 8px rgba(120,90,255,0.4);
    margin-bottom: 14px;
  }
  #msgInput:focus {
    outline: none;
    box-shadow: 0 0 18px 4px rgba(160,110,255,0.5), inset 0 0 15px #b699ff;
    background: #2b174f;
  }

  #sendBtn { width: 100%; margin-bottom: 21px; }

  textarea.sdpTextArea {
    width: 100%;
    max-width: 680px;
    margin-top: 6px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: #1d1242;
    color: #d5caff;
    padding: 12px;
    border: none;
    resize: vertical;
    font-family: monospace;
    font-size: 0.9rem;
    box-shadow: inset 0 0 8px rgba(130,100,255,0.3);
  }
  textarea.sdpTextArea:focus {
    outline: none;
    box-shadow: 0 0 20px 4px rgba(150,110,255,0.4), inset 0 0 12px rgba(190,150,255,0.3);
    background: #2b1958;
  }

  .sdpBtn {
    padding: 10px 28px;
    margin-right: 10px;
    font-weight: 600;
    font-size: 1rem;
    background: linear-gradient(90deg,#8150ff 48%,#2ea7ff 110%);
    color: #fff;
    border-radius: 12px;
    border: none;
    box-shadow: 0 4px 15px rgba(120,90,255,0.6);
    transition: all 0.3s ease;
  }
  .sdpBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(140,100,255,0.8);
  }

  .sdpContainer {
    width: 100%;
    max-width: 720px;
    margin-top: 8px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-start;
  }

  /* Full targeting cursor */
  .target-cursor-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 99999;
    mix-blend-mode: difference;
    transform: translate(-50%, -50%);
  }

  .target-cursor-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #b285ff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    will-change: transform, background;
    transition: background 0.18s;
    box-shadow: 0 0 6px #c59fff;
  }

  .target-cursor-corner {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    border: 3px solid #b285ff;
    will-change: transform;
    transition: border-color 0.18s;
    filter: drop-shadow(0 0 3px #c59fff);
  }

  .corner-tl { transform: translate(-150%, -150%); border-right: none; border-bottom: none; }
  .corner-tr { transform: translate(50%, -150%); border-left: none; border-bottom: none; }
  .corner-br { transform: translate(50%, 50%); border-left: none; border-top: none; }
  .corner-bl { transform: translate(-150%, 50%); border-right: none; border-top: none; }

  .cursor-active { filter: drop-shadow(0 0 12px #ba95ff) brightness(1.3); }
  .cursor-dot-active { background: #d0a9ff; box-shadow: 0 0 12px #d0a9ff; }
  .cursor-corner-active { border-color: #d7b7ff !important; filter: drop-shadow(0 0 8px #e1c7ff); }
</style>
</head>
<body>
<h1 id="appName">CHATBLES</h1>
<div id="landingButtons">
  <button id="btnChat">Chat</button>
  <button id="btnVideoChat">Video Chat</button>
</div>

<section id="chatSection">
  <button class="exitBtn" id="exitChat">Exit Chat</button>
  <h2>Text Chat</h2>
  <div id="chatBox"></div>
  <input type="text" id="msgInput" placeholder="Type message..."/>
  <button id="sendBtn">Send</button>
  <h3>SDP Exchange</h3>
  <div class="sdpContainer">
    <textarea id="localSDPChat" class="sdpTextArea"></textarea>
    <button id="makeOfferBtnChat" class="sdpBtn">Create Offer</button>
    <button id="makeAnswerBtnChat" class="sdpBtn">Create Answer</button>
    <textarea id="remoteSDPChat" class="sdpTextArea"></textarea>
    <button id="applyRemoteBtnChat" class="sdpBtn">Apply Remote</button>
  </div>
</section>

<section id="videoCallSection">
  <button class="exitBtn" id="exitVideo">Exit Video Chat</button>
  <h2>Video Call</h2>
  <div id="videos">
    <div class="camera-box"><video id="localVideo" autoplay playsinline muted></video></div>
    <div class="remote-box"><video id="remoteVideo" autoplay playsinline></video></div>
  </div>
  <button id="startCamBtn">Start Camera & Mic</button>
  <h3>SDP Exchange</h3>
  <div class="sdpContainer">
    <textarea id="localSDPVideo" class="sdpTextArea"></textarea>
    <button id="makeOfferBtnVideo" class="sdpBtn">Create Offer</button>
    <button id="makeAnswerBtnVideo" class="sdpBtn">Create Answer</button>
    <textarea id="remoteSDPVideo" class="sdpTextArea"></textarea>
    <button id="applyRemoteBtnVideo" class="sdpBtn">Apply Remote</button>
  </div>
</section>

<div id="cursor" class="target-cursor-wrapper">
  <div class="target-cursor-dot"></div>
  <div class="target-cursor-corner corner-tl"></div>
  <div class="target-cursor-corner corner-tr"></div>
  <div class="target-cursor-corner corner-br"></div>
  <div class="target-cursor-corner corner-bl"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
const landingButtons=document.getElementById('landingButtons');
const chatSection=document.getElementById('chatSection');
const videoCallSection=document.getElementById('videoCallSection');
document.getElementById('btnChat').onclick=()=>{landingButtons.style.display='none';videoCallSection.style.display='none';chatSection.style.display='flex';};
document.getElementById('btnVideoChat').onclick=()=>{landingButtons.style.display='none';chatSection.style.display='none';videoCallSection.style.display='flex';};
document.getElementById('exitChat').onclick=()=>{chatSection.style.display='none';landingButtons.style.display='flex';};
document.getElementById('exitVideo').onclick=()=>{videoCallSection.style.display='none';landingButtons.style.display='flex';};
let pcChat=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
let pcVideo=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
let dataChannelChat=null;
let dataChannelVideo=null;
const msgInput=document.getElementById('msgInput');
const chatBox=document.getElementById('chatBox');
function appendChat(t){const d=document.createElement('div');d.textContent=t;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
document.getElementById('sendBtn').onclick=()=>{if(!dataChannelChat||msgInput.value.trim()==='')return;dataChannelChat.send(msgInput.value);appendChat("You: "+msgInput.value);msgInput.value='';};
msgInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('sendBtn').click();}};
pcChat.ondatachannel=e=>{dataChannelChat=e.channel;dataChannelChat.onmessage=e=>appendChat("Friend: "+e.data);};
document.getElementById('makeOfferBtnChat').onclick=async()=>{dataChannelChat=pcChat.createDataChannel("chat");dataChannelChat.onmessage=e=>appendChat("Friend: "+e.data);const offer=await pcChat.createOffer();await pcChat.setLocalDescription(offer);};
pcChat.onicecandidate=e=>{if(!e.candidate)document.getElementById("localSDPChat").value=JSON.stringify(pcChat.localDescription);};
document.getElementById('makeAnswerBtnChat').onclick=async()=>{const remoteDesc=JSON.parse(document.getElementById("remoteSDPChat").value);await pcChat.setRemoteDescription(remoteDesc);const answer=await pcChat.createAnswer();await pcChat.setLocalDescription(answer);};
document.getElementById('applyRemoteBtnChat').onclick=()=>{const remoteDesc=JSON.parse(document.getElementById("remoteSDPChat").value);pcChat.setRemoteDescription(remoteDesc);};
document.getElementById('startCamBtn').onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('localVideo').srcObject=s;s.getTracks().forEach(tr=>pcVideo.addTrack(tr,s));};
pcVideo.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};
document.getElementById('makeOfferBtnVideo').onclick=async()=>{dataChannelVideo=pcVideo.createDataChannel("videoChat");const o=await pcVideo.createOffer();await pcVideo.setLocalDescription(o);document.getElementById("localSDPVideo").value=JSON.stringify(o);};
pcVideo.onicecandidate=e=>{if(!e.candidate)document.getElementById("localSDPVideo").value=JSON.stringify(pcVideo.localDescription);};
document.getElementById('makeAnswerBtnVideo').onclick=async()=>{const d=JSON.parse(document.getElementById("remoteSDPVideo").value);await pcVideo.setRemoteDescription(d);const a=await pcVideo.createAnswer();await pcVideo.setLocalDescription(a);document.getElementById("localSDPVideo").value=JSON.stringify(a);};
document.getElementById('applyRemoteBtnVideo').onclick=()=>{const d=JSON.parse(document.getElementById("remoteSDPVideo").value);pcVideo.setRemoteDescription(d);};
const cursor=document.getElementById("cursor");
const dot=cursor.querySelector(".target-cursor-dot");
const corners=Array.from(cursor.querySelectorAll(".target-cursor-corner"));
let mouse={x:window.innerWidth/2,y:window.innerHeight/2},pos={x:window.innerWidth/2,y:window.innerHeight/2},activeTarget=null,targetCenter=null,targetRect=null;
const setX=gsap.quickSetter(cursor,"x","px"),setY=gsap.quickSetter(cursor,"y","px");
window.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
gsap.ticker.add(()=>{pos.x+=(mouse.x-pos.x)*0.3;pos.y+=(mouse.y-pos.y)*0.3;setX(pos.x);setY(pos.y);
if(activeTarget){const b=activeTarget.getBoundingClientRect();const cPos=[[b.left,b.top],[b.right,b.top],[b.right,b.bottom],[b.left,b.bottom]];
cPos.forEach((p,i)=>{gsap.to(corners[i],{x:p[0]-pos.x,y:p[1]-pos.y,duration:0.2,ease:'power2.out'});});}
else{const def=[[-18,-18],[6,-18],[6,6],[-18,6]];
def.forEach((v,i)=>{gsap.to(corners[i],{x:v[0],y:v[1],duration:0.2,ease:'power1.inOut'});});}});
document.querySelectorAll("button,input,textarea").forEach(el=>{
  el.addEventListener("mouseenter",()=>{activeTarget=el;const b=el.getBoundingClientRect();targetCenter={x:b.left+b.width/2,y:b.top+b.height/2};cursor.classList.add('cursor-active');dot.classList.add('cursor-dot-active');corners.forEach(c=>c.classList.add('cursor-corner-active'));});
  el.addEventListener("mouseleave",()=>{activeTarget=null;targetCenter=null;cursor.classList.remove('cursor-active');dot.classList.remove('cursor-dot-active');corners.forEach(c=>c.classList.remove('cursor-corner-active'));});
});
</script>
</body>
</html>
